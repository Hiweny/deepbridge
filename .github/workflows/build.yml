name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            echo "Release keystore injected."
          else
            echo "::warning::No keystore secret found, falling back to debug signing."
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          NAME="deepbridge-${GITHUB_REF_NAME:-dev}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          ls -la "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DeepBridge ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbridge-apk
          path: deepbridge-*.apk
          if-no-files-found: error
